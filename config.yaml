# TrustFed v2 configuration (Scientific Reports submission)
# Every value here is written into each run's summary.json.

# Federated learning
n_clients: 20
participation: 0.75
n_rounds: 60              # sigma is calibrated for ALL rounds; fewer rounds = less noise
local_epochs: 1           # under DP, 1 epoch per round gives the best utility per unit of epsilon
batch_size: 2048          # noise on the averaged gradient ~ sigma/B: bigger batch = less effective noise
max_physical_batch: 512   # DP only: per-sample gradients computed in chunks (memory), same logical batch
lr: 0.003                 # DP-SGD needs a larger step than non-private training (pilot: +26 pt macro-F1)
weight_decay: 0.0001
early_stop_patience: 15
alpha: 0.5                 # Dirichlet concentration (default split)
min_client_size: 2000      # redraw Dirichlet until every client has >= this many rows
min_test_per_class: 30     # guarantees a usable per-class F1 for rare classes
min_unique_patterns: 10    # classes with fewer distinct feature vectors are excluded (and reported)
root_per_class: 100        # carved out for FLTrust for EVERY method (identical client data)
scaler: quantile           # quantile (recommended) | minmax

# Model (GroupNorm everywhere; see trustfed/models.py)
arch: residual_mlp
hidden: 256
n_blocks: 3

# Differential privacy (Opacus DP-SGD, applied to EVERY client when on)
# Run `python scripts/plan_dp.py --dataset X` first: it prints the per-client
# epsilon your sigma/epochs/batch will produce, before any training.
dp_sigma: 2.77            # used only if dp_target_eps is null
dp_target_eps: 8.0        # main runs; the privacy group also reports 1, 3 and no-DP
dp_clip: 1.0
dp_delta: 1.0e-5

# Trust scoring
trust_alpha: 0.3
trust_beta: 0.2
trust_gamma: 0.5
trust_kappa: 5.0
trust_threshold: 0.20
trust_flag_rule: fixed      # fixed (paper, uses trust_threshold) | mad (median - k*MAD per round)
trust_mad_k: 1.5

# Explanation audit
shap_method: expected_gradients   # expected_gradients (batched, default) | gradient (shap lib) | kernel

# Response agent (Double DQN)
agent_gamma: 0.0
agent_ep_len: 500
agent_train_episodes: 200
agent_test_episodes: 20
agent_lr: 0.003                 # DP-SGD needs a larger step than non-private training (pilot: +26 pt macro-F1)

# Centralised references
centralised_epochs: 30

device: cpu
datasets: [Edge-IIoTset, CICIDS2017]
