n_clients: 20
participation: 0.75
n_rounds: 60
local_epochs: 1
batch_size: 2048
max_physical_batch: 512
lr: 0.003
weight_decay: 0.0001
early_stop_patience: 15
alpha: 0.5
min_client_size: 2000
min_test_per_class: 30
min_unique_patterns: 10
root_per_class: 100
scaler: quantile

arch: residual_mlp
hidden: 256
n_blocks: 3

dp_sigma: 2.77
dp_target_eps: 8.0
dp_clip: 1.0
dp_delta: 1.0e-5

trust_alpha: 0.3
trust_beta: 0.2
trust_gamma: 0.5
trust_kappa: 5.0
trust_threshold: 0.20
trust_flag_rule: fixed
trust_mad_k: 1.5

shap_method: expected_gradients

centralised_epochs: 30

device: cpu
datasets: [Edge-IIoTset, CICIDS2017]
